name: flutter_wordle
description: "A new Flutter project."


publish_to: 'none' 













version: 1.0.0+1

environment:
  sdk: ^3.8.1







dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.8
  device_preview: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  
  
  
  
  
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1





flutter:

  
  
  
  uses-material-design: true

  
  assets:
    - assets/all_english_words/
    - assets/easy_words_json/
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#4DB6AC"
  adaptive_icon_foreground: "assets/icon.png"
  remove_alpha_ios: true
  
